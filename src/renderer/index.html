<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Gushu</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="tab-strip" id="tab-strip">
      <span class="private-badge" id="private-badge">Private</span>
      <!-- tabs and group chips are injected here by renderer.js -->
      <button id="new-tab-btn" class="new-tab-btn" title="New tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14" /></svg>
      </button>
    </div>

    <div class="toolbar">
      <div class="nav-buttons">
        <button id="back-btn" class="ib" title="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6" /></svg>
        </button>
        <button id="forward-btn" class="ib" title="Forward">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6" /></svg>
        </button>
        <button id="reload-btn" class="ib" title="Reload">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8" /><path d="M21 3v5h-5" /></svg>
        </button>
      </div>

      <div class="omni-wrap">
        <label class="omni" for="address-bar">
          <button id="adblock-toggle" class="shield" type="button" aria-expanded="false" title="Ad and tracker blocking">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" /><path d="m9 12 2 2 4-4" /></svg>
            <span id="adblock-label">On</span>
          </button>
          <input id="address-bar" type="text" placeholder="Search or enter address" autocomplete="off" spellcheck="false" />
          <button id="reader-btn" class="ib" title="Reader Mode (&#8679;&#8984;R)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z" /><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5" /></svg>
          </button>
          <button id="bookmark-btn" class="ib star" title="Bookmark this page (&#8984;D)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z" /></svg>
          </button>
        </label>
        <div class="suggest-dropdown" id="suggest-dropdown"></div>
        <div class="pop" id="shield-pop" hidden>
          <h3>Gushu Shield</h3>
          <p>Ads and trackers are blocked across every site. Pages load faster and nobody follows you around.</p>
          <button class="switch" id="shield-switch-btn" type="button">
            Block ads and trackers
            <span class="sw" id="shield-sw"></span>
          </button>
          <div class="stats">
            <div><b id="pop-blocked">0</b>blocked this session</div>
            <div><b id="pop-networks">0</b>networks</div>
          </div>
        </div>
      </div>

      <button id="vpn-btn" class="vpn-btn" type="button" title="VPN — hide your IP and location (via Tor)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 7v6c0 5 4 9 9 9s9-4 9-9V7z" /></svg>
        <span id="vpn-label">VPN</span>
      </button>
      <button id="downloads-btn" class="ib" title="Downloads (&#8997;&#8984;L)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12" /><path d="m7 10 5 5 5-5" /><path d="M5 21h14" /></svg>
      </button>
      <button id="history-btn" class="ib" title="History">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8" /><path d="M12 9v4l2 2" /><path d="M10 2h4" /></svg>
      </button>
      <button id="bookmarks-btn" class="ib" title="Bookmarks">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6" /><line x1="8" y1="12" x2="21" y2="12" /><line x1="8" y1="18" x2="21" y2="18" /><line x1="3" y1="6" x2="3.01" y2="6" /><line x1="3" y1="12" x2="3.01" y2="12" /><line x1="3" y1="18" x2="3.01" y2="18" /></svg>
      </button>
      <button id="privacy-btn" class="ib" title="Privacy Report">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" /><path d="m9 12 2 2 4-4" /></svg>
      </button>
      <span class="avatar" id="profile-badge" title="Profile"></span>
      <button id="settings-btn" class="ib" title="Settings (&#8984;,)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="1" /><circle cx="12" cy="12" r="1" /><circle cx="12" cy="19" r="1" /></svg>
      </button>
    </div>

    <div class="find-bar" id="find-bar">
      <input id="find-input" type="text" placeholder="Find in page" autocomplete="off" spellcheck="false" />
      <span class="find-count" id="find-count"></span>
      <button class="ib" id="find-prev-btn" title="Previous match">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6" /></svg>
      </button>
      <button class="ib" id="find-next-btn" title="Next match">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6" /></svg>
      </button>
      <button class="ib" id="find-close-btn" title="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12" /></svg>
      </button>
    </div>

    <div class="webview-container" id="webview-container">
      <!-- <webview> elements are injected here by renderer.js -->
    </div>

    <div class="ctx-menu" id="ctx-menu">
      <button data-action="new-group">New Tab Group</button>
      <div class="ctx-group-list" id="ctx-group-list"></div>
      <button data-action="remove-group">Remove from Group</button>
      <div class="ctx-sep"></div>
      <button data-action="close">Close Tab</button>
    </div>

    <script src="nav-utils.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
