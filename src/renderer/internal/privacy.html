<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Privacy Report</title>
    <link rel="stylesheet" href="internal.css" />
    <style>
      .shield {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 20px 0 36px;
      }
      .shield-count {
        font-size: 48px;
        font-weight: 700;
        background: linear-gradient(135deg, var(--nebula-cyan), var(--nebula-purple));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .shield-label {
        color: var(--text-dim);
        font-size: 13px;
        margin-top: 4px;
      }
      .bar-track {
        flex: 1 1 auto;
        height: 6px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
        margin-top: 6px;
      }
      .bar-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--nebula-purple), var(--nebula-cyan));
      }
      .row-count {
        flex: 0 0 auto;
        font-size: 12px;
        color: var(--text-dim);
        min-width: 32px;
        text-align: right;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <h1>Privacy Report</h1>
      <p class="subtitle">Trackers and ad networks blocked in this profile, broken down by network.</p>

      <div class="shield">
        <div class="shield-count" id="total-count">0</div>
        <div class="shield-label">requests blocked</div>
      </div>

      <div class="list" id="list"></div>
    </div>
    <script src="privacy.js"></script>
  </body>
</html>
